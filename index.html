<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Navigation & Video Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .top-bar {
            position: relative;
            width: 100%;
            height: 50px;
            background-color: #f7ca73;
            margin-bottom: 15px;
        }

        .top-bar .upload-icon-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            background-color: #004d40;
            color: #ffffff;
            width: 45px;
            height: 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        .top-bar .upload-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
        }

        .instruction-box {
            width: 100%;
            background-color: #004d40;
            border: 2px solid #00e5ff;
            border-radius: 20px;
            padding: 20px;
            color: #ffffff;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .instruction-box .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .instruction-box .subtitle {
            font-size: 16px;
            margin-bottom: 15px;
            color: #b2dfdb;
        }

        .question-box {
            width: 100%;
            height: 180px;
            background-color: #002520;
            border: 2px dashed #00e5ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .question-box span {
            font-size: 80px;
            font-weight: bold;
            color: #00e5ff;
            user-select: none;
        }

        .step-btn {
            display: block;
            width: 100%;
            background-color: #004d40;
            border: 2px solid #00e5ff;
            border-radius: 35px;
            padding: 14px 20px;
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }

        .step-btn.locked {
            background-color: #1a2327;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .step-btn.completed {
            background-color: #2e7d32;
            border-color: #66bb6a;
            color: #ffffff;
            cursor: default;
        }

        .step-btn.disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        .more-videos-btn {
            display: block;
            width: 100%;
            background-color: #00e5ff;
            color: #000000;
            border: 2px solid #00e5ff;
            border-radius: 35px;
            padding: 14px 20px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .more-videos-btn:hover {
            background-color: #00b8d4;
            color: #ffffff;
        }

        #download-section {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-height: 55vh;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #00e5ff;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container video {
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            display: block;
        }

        .small-download-btn {
            display: block;
            width: 100%;
            background-color: #00e5ff;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            border: 2px solid #00e5ff;
            cursor: pointer;
            text-align: center;
        }

        #upload-page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .upload-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .big-upload-btn {
            width: 100%;
            background-color: #004d40;
            border: 2px solid #00e5ff;
            border-radius: 35px;
            padding: 10px 18px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-left-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .btn-icon {
            font-size: 20px;
        }

        .btn-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-input-field {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            width: 100%;
        }

        .link-input-field::placeholder {
            color: #b2dfdb;
        }

        .btn-right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn-small {
            background-color: #00e5ff;
            color: #000000;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .download-btn-small:hover {
            background-color: #00b8d4;
            color: #ffffff;
        }

        .btn-arrow {
            font-size: 18px;
            color: #00e5ff;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .video-details-card {
            display: none;
            width: 100%;
            background-color: #002520;
            border: 2px solid #00e5ff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
            flex-direction: column;
            gap: 15px;
        }

        .small-video-preview {
            width: 100%;
            max-height: 200px;
            border-radius: 8px;
            background-color: #000000;
            border: 1px solid #00e5ff;
        }

        .details-info {
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #e0f2f1;
            background: #001a17;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #004d40;
        }

        .details-info p {
            margin-bottom: 5px;
            word-break: break-all;
        }

        .details-info p span {
            color: #00e5ff;
            font-weight: bold;
        }

        .download-link-style {
            color: #00e5ff;
            text-decoration: underline;
            cursor: pointer;
        }

        #more-videos-page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .category-buttons-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .category-big-btn {
            width: 100%;
            background-color: #004d40;
            border: 2px solid #00e5ff;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 20px;
            border-radius: 35px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            transition: all 0.2s ease;
        }

        .category-big-btn:hover {
            background-color: #00695c;
            transform: translateY(-2px);
        }

        .videos-gallery {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-card {
            background-color: #002520;
            border: 2px solid #00e5ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
        }

        .video-card:active {
            transform: scale(0.97);
        }

        .video-thumb-container {
            position: relative;
            width: 100%;
            height: 130px;
            background-color: #000000;
        }

        .video-thumb-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .video-card .card-title {
            padding: 8px 4px;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            background-color: #001a17;
            border-top: 1px solid #004d40;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>

<body>

    <div class="top-bar">
        <button class="upload-icon-btn" onclick="openUploadPage()">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        </button>
    </div>

    <div class="container">
        <!-- Step Section -->
        <div id="steps-section" style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
            <div class="instruction-box">
                <div class="title">নির্দেশনা</div>
                <div class="subtitle">ভিডিওটি ভালো করে দেখুন</div>
                <div class="question-box"><span>?</span></div>
            </div>
            <button id="step1" class="step-btn" onclick="startProcess(1, 'https://example.com/step1')">Step 1 শুরু করুন</button>
            <button id="step2" class="step-btn locked" onclick="startProcess(2, 'https://example.com/step2')">Step 2 (Locked)</button>
            <button id="step3" class="step-btn locked" onclick="startProcess(3, 'https://example.com/step3')">Step 3 (Locked)</button>
            <button id="step4" class="step-btn locked" onclick="startProcess(4, 'https://example.com/step4')">Step 4 (Locked)</button>
            
            <button class="more-videos-btn" onclick="openMoreVideosPage()">আরও মজার ভিডিও দেখতে ক্লিক করুন 👈</button>
        </div>

        <!-- Download Section -->
        <div id="download-section">
            <div class="video-container">
                <video id="final-video" controls autoplay playsinline>
                    <source id="final-video-source" src="" type="video/mp4">
                </video>
            </div>
            <a id="main-download-btn" href="#" download class="small-download-btn">Download Now</a>
        </div>

        <!-- Upload Page -->
        <div id="upload-page">
            <button class="back-btn" onclick="closeUploadPage()">← পিছনে ফিরে যান</button>
            
            <div class="upload-block">
                <div class="big-upload-btn" onclick="toggleFileUploadCard()">
                    <div class="btn-left-content">
                        <span id="upload-icon" class="btn-icon">📁</span>
                        <span id="upload-btn-text" class="btn-text">আপলোড ভিডিও</span>
                    </div>
                    <span id="arrow-icon" class="btn-arrow">▼</span>
                </div>
                <input type="file" id="hidden-video-input" accept="video/*" style="display: none;" onchange="handleVideoUpload(this)">

                <div id="video-details-card" class="video-details-card">
                    <video id="preview-video" class="small-video-preview" controls></video>
                    <div class="details-info">
                        <p><span>ভিডিও টাইটেল:</span> <span id="info-name" style="color: #fff;">-</span></p>
                        <p><span>ডাউনলোড লিংক:</span> <a id="info-download-link" class="download-link-style" href="#" download>-</a></p>
                        <p><span>টাইপ:</span> <span id="info-type" style="color: #fff;">-</span></p>
                        <p><span>স্ট্যাটাস:</span> <span style="color: #66bb6a; font-weight: bold;">সফলভাবে লোড হয়েছে ✔</span></p>
                    </div>
                </div>
            </div>

            <div class="upload-block">
                <div class="big-upload-btn">
                    <div class="btn-left-content">
                        <span class="btn-icon">🔗</span>
                        <input type="url" id="custom-link-input" class="link-input-field" placeholder="সোশ্যাল মিডিয়া ভিডিও লিংক পেস্ট করুন...">
                    </div>
                    <div class="btn-right-actions">
                        <button id="link-download-btn" class="download-btn-small" onclick="downloadAndLoadVideo()">Fetch & Play</button>
                        <span id="link-arrow-icon" class="btn-arrow" onclick="toggleLinkCard()">▼</span>
                    </div>
                </div>

                <div id="link-details-card" class="video-details-card">
                    <video id="link-preview-video" class="small-video-preview" controls autoplay playsinline></video>
                    <div class="details-info">
                        <p><span>মূল লিংক:</span> <span id="link-info-original" style="color: #fff;">-</span></p>
                        <p><span>জেনারেটেড লিংক:</span> <a id="link-info-generated" class="download-link-style" href="#" target="_blank">-</a></p>
                        <p><span>টাইপ:</span> <span id="link-info-type" style="color: #fff;">External Video Link</span></p>
                        <p><span>স্ট্যাটাস:</span> <span id="download-status-text" style="color: #66bb6a; font-weight: bold;">লিংক দেওয়ার জন্য তৈরি</span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- More Videos Page -->
        <div id="more-videos-page">
            <button class="back-btn" onclick="closeMoreVideosPage()">← পিছনে ফিরে যান</button>
            <h3 style="color: #00e5ff; margin-bottom: 5px;">সব ভিডিওসমূহ</h3>
            
            <div class="category-buttons-container">

        </div>
    </div>

        }

        function setTargetVideo(videoSrc) {
            const finalVideoSource = document.getElementById('final-video-source');
            const finalVideo = document.getElementById('final-video');
            const mainDownloadBtn = document.getElementById('main-download-btn');

            finalVideoSource.src = videoSrc;
            finalVideo.load();
            mainDownloadBtn.href = videoSrc;
        }

        function openUploadPage() {
            document.getElementById('steps-section').style.display = 'none';
            document.getElementById('download-section').style.display = 'none';
            document.getElementById('more-videos-page').style.display = 'none';
            document.getElementById('upload-page').style.display = 'flex';
        }

        function closeUploadPage() {
            document.getElementById('upload-page').style.display = 'none';
            document.getElementById('steps-section').style.display = 'flex';
        }

        function openMoreVideosPage() {
            document.getElementById('steps-section').style.display = 'none';
            document.getElementById('download-section').style.display = 'none';
            document.getElementById('upload-page').style.display = 'none';
            document.getElementById('more-videos-page').style.display = 'flex';
            renderVideosGallery();
        }

        function closeMoreVideosPage() {
            document.getElementById('more-videos-page').style.display = 'none';
            document.getElementById('steps-section').style.display = 'flex';
        }

        function toggleFileUploadCard() {
            const card = document.getElementById('video-details-card');
            if (card.style.display === 'flex') {
                card.style.display = 'none';
                document.getElementById('arrow-icon').style.transform = 'rotate(0deg)';
            } else {
                document.getElementById('hidden-video-input').click();
            }
        }

        function toggleLinkCard() {
            const card = document.getElementById('link-details-card');
            const arrow = document.getElementById('link-arrow-icon');
            if (card.style.display === 'flex') {
                card.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            } else {
                card.style.display = 'flex';
                arrow.style.transform = 'rotate(180deg)';
            }
        }

        function handleVideoUpload(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('upload-icon').innerText = "🎬";
                document.getElementById('upload-btn-text').innerText = file.name;
                document.getElementById('arrow-icon').style.transform = "rotate(180deg)";

                const uploadedVideoUrl = URL.createObjectURL(file);
                
                const previewVideo = document.getElementById('preview-video');
                previewVideo.src = uploadedVideoUrl;
                previewVideo.load();

                document.getElementById('info-name').innerText = file.name;
                const linkElem = document.getElementById('info-download-link');
                linkElem.href = uploadedVideoUrl;
                linkElem.download = file.name;
                linkElem.innerText = "ডাউনলোড করুন (" + file.name + ")";
                document.getElementById('info-type').innerText = file.type || "video/mp4";

                setTargetVideo(uploadedVideoUrl);
                document.getElementById('video-details-card').style.display = 'flex';

                dynamicallyUploadedVideos.push({
                    title: file.name,
                    url: uploadedVideoUrl,
                    category: "all"
                });
            }
        }

        async function downloadAndLoadVideo() {
            const inputField = document.getElementById('custom-link-input');
            const targetUrl = inputField.value.trim();
            const dlBtn = document.getElementById('link-download-btn');
            const statusText = document.getElementById('download-status-text');

            if (!targetUrl) {
                alert("অনুগ্রহ করে একটি সঠিক ভিডিও URL দিন!");
                return;
            }

            document.getElementById('link-details-card').style.display = 'flex';
            document.getElementById('link-arrow-icon').style.transform = "rotate(180deg)";

            try {
                dlBtn.innerText = "প্রসেস হচ্ছে...";
                dlBtn.disabled = true;
                statusText.innerText = "সার্ভার থেকে ভিডিও খোঁজা হচ্ছে...";
                statusText.style.color = "#ffb74d";
                document.getElementById('link-info-original').innerText = targetUrl;

                const response = await fetch(`https://kana-backend-27uz.onrender.com/fetch-video?url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();

                if (data.direct_mp4) {
                    const previewVideo = document.getElementById('link-preview-video');
                    previewVideo.src = data.direct_mp4;
                    previewVideo.load();
                    previewVideo.play();
                    
                    const genLinkElem = document.getElementById('link-info-generated');
                    genLinkElem.href = data.direct_mp4;
                    genLinkElem.innerText = data.direct_mp4;

                    setTargetVideo(data.direct_mp4);

                    statusText.innerText = "লিংক জেনারেট ও ভিডিও প্লে সফল হয়েছে ✔";
                    statusText.style.color = "#66bb6a";

                    dynamicallyUploadedVideos.push({
                        title: targetUrl,
                        url: data.direct_mp4,
                        category: "all"
                    });
                } else {
                    statusText.innerText = "ভিডিও বের করা সম্ভব হয়নি ❌";
                    statusText.style.color = "#ef5350";
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "সার্ভার এরর! আবার চেষ্টা করুন ❌";
                statusText.style.color = "#ef5350";
            } finally {
                dlBtn.innerText = "Fetch & Play";
                dlBtn.disabled = false;
            }
        }

        function filterCategory(categoryName) {
            renderVideosGallery(categoryName);
        }

        function renderVideosGallery(filter = 'all') {
            const galleryContainer = document.getElementById('videos-gallery-list');
            galleryContainer.innerHTML = '';

            const allVideos = [...dynamicallyUploadedVideos, ...staticFolderVideos];
            const filteredVideos = filter === 'all' 
                ? allVideos 
                : allVideos.filter(item => item.category === filter || item.category === 'all');

            filteredVideos.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => selectVideo(item.url);
                card.innerHTML = `
                    <div class="video-thumb-container">
                        <video src="${item.url}#t=0.5" preload="metadata"></video>
                    </div>
                    <div class="card-title">${item.title}</div>
                `;
                galleryContainer.appendChild(card);
            });
        }

        function startProcess(stepNum, targetUrl) {
            if (stepNum !== activeStep || isWaiting) return;
            const btn = document.getElementById(`step${stepNum}`);
            let redirectTimer = 1;

            btn.classList.add('disabled');
            btn.innerHTML = `অপেক্ষা করুন... (${redirectTimer}s)`;

            const initialInterval = setInterval(() => {
                redirectTimer--;
                if (redirectTimer > 0) {
                    btn.innerHTML = `অপেক্ষা করুন... (${redirectTimer}s)`;
                } else {
                    clearInterval(initialInterval);
                    window.open(targetUrl, '_blank');

                    isWaiting = true;
                    currentStepNum = stepNum;
                    startTime = Date.now(); 

                    btn.innerHTML = `সাইটে ৩ সেকেন্ড থাকুন...`;
                }
            }, 1000);
        }

        document.addEventListener("visibilitychange", function() {
            if (!document.hidden && isWaiting) {
                const btn = document.getElementById(`step${currentStepNum}`);
                const elapsedTime = Math.floor((Date.now() - startTime) / 1000);

                if (elapsedTime >= 3) {
                    isWaiting = false;

                    if (currentStepNum < 4) {
                        btn.innerHTML = `Step ${currentStepNum} Completed ✔`;
                        btn.classList.remove('disabled');
                        btn.classList.add('completed');

                        activeStep = currentStepNum + 1;
                        const nextBtn = document.getElementById(`step${activeStep}`);
                        if (nextBtn) {
                            nextBtn.classList.remove('locked');
                            nextBtn.innerHTML = `Step ${activeStep} শুরু করুন`;
                        }
                    } else if (currentStepNum === 4) {
                        startRunningStep4(btn);
                    }
                } else {
                    alert("আপনি ৩ সেকেন্ড পূরণ করার আগেই ফিরে এসেছেন! আবার চেষ্টা করুন।");
                    isWaiting = false;
                    btn.classList.remove('disabled');
                    btn.innerHTML = `Step ${currentStepNum} আবার চেষ্টা করুন`;
                }
            }
        });

        function startRunningStep4(btn) {
            let count = 1;
            btn.innerHTML = `রানিং... (${count}s)`;

            const runInterval = setInterval(() => {
                count++;
                if (count <= 3) {
                    btn.innerHTML = `রানিং... (${count}s)`;
                } else {
                    clearInterval(runInterval);
                    document.getElementById('steps-section').style.display = 'none';
                    document.getElementById('upload-page').style.display = 'none';
                    document.getElementById('more-videos-page').style.display = 'none';
                    document.getElementById('download-section').style.display = 'flex';
                }
            }, 1000);
        }
    </script>
</body>
</html>
