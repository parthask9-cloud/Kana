<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana - Social Media Video Fetcher & Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="url"] {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="url"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 14px 24px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .video-card {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        video {
            width: 100%;
            border-radius: 8px;
            max-height: 400px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kana Video Player</h1>
        
        <div class="input-group">
            <input type="url" id="social-link-input" placeholder="সোশ্যাল মিডিয়া ভিডিও লিংক পেস্ট করুন..." required>
            <button id="fetch-btn" onclick="fetchAndPlayVideo()">Fetch & Play</button>
        </div>

        <div class="video-card" id="video-card">
            <video id="auto-player" controls autoplay></video>
        </div>
    </div>

    <!-- জাভাস্ক্রিপ্ট কোড শুরু -->
    <script>
        async function fetchAndPlayVideo() {
            const inputUrl = document.getElementById('social-link-input').value.trim();
            const fetchBtn = document.getElementById('fetch-btn');
            const player = document.getElementById('auto-player');
            const videoCard = document.getElementById('video-card');

            if (!inputUrl) {
                alert("দয়া করে একটি সঠিক ভিডিও লিংক দিন!");
                return;
            }

            try {
                fetchBtn.innerText = "প্রসেস হচ্ছে...";
                fetchBtn.disabled = true;

                // Render-এ হোস্ট করা আপনার Node.js ব্যাকএন্ডে রিকোয়েস্ট পাঠানো হচ্ছে
                const response = await fetch(`https://kana-backend-27uz.onrender.com/fetch-video?url=${encodeURIComponent(inputUrl)}`);
                const data = await response.json();

                if (data.direct_mp4) {
                    player.src = data.direct_mp4;
                    player.load();
                    player.play();
                    videoCard.style.display = 'flex';
                } else {
                    alert("ভিডিও এক্সট্র্যাক্ট করা যায়নি! লিংকটি আবার চেক করুন।");
                }
            } catch (err) {
                alert("সার্ভার কানেকশন এরর! Render সার্ভার চালু হতে কয়েক সেকেন্ড সময় নিতে পারে, আবার চেষ্টা করুন।");
            } finally {
                fetchBtn.innerText = "Fetch & Play";
                fetchBtn.disabled = false;
            }
        }
    </script>
    <!-- জাভাস্ক্রিপ্ট কোড শেষ -->

</body>
</html>
